name: Continuous Integration & Security Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BACKEND ---
      - name: Extract Docker Metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/backend-api
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      # Build local image for security scan
      - name: Build Backend Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: backend-api:local

      # Scan Backend with Trivy
      - name: Run Trivy Vulnerability Scanner on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend-api:local'
          format: 'table'
          exit-code: '0' # Set to '1' in production to block deployment on CRITICAL vulnerabilities
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Push Backend Image
      - name: Push Backend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # --- FRONTEND ---
      - name: Extract Docker Metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/frontend-ui
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      # Build local image for security scan
      - name: Build Frontend Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: frontend-ui:local

      # Scan Frontend with Trivy
      - name: Run Trivy Vulnerability Scanner on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'frontend-ui:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Push Frontend Image
      - name: Push Frontend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
      
      # --- AUTOMATED GITOPS MANIFEST UPDATE ---
      - name: Checkout Manifests Repository
        uses: actions/checkout@v4
        with:
          repository: 'Abdullah07-creator/gitops-manifests'
          token: ${{ secrets.PAT_TOKEN }}
          path: 'gitops-manifests'

      - name: Update Image Tag in Helm values.yaml
        run: |
          cd gitops-manifests/helm/web-app
          # Update the tag value with the new GitHub SHA
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' values.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add values.yaml
          git commit -m "ci: update backend & frontend image tags to ${{ github.sha }}" || exit 0
          git push origin main